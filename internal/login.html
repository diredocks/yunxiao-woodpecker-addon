<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云效 Woodpecker 登录</title>
<style>
body {
  font-family: sans-serif;
  font-size: 14px;
  background: #fff;
  color: #000;
}
table {
  margin: 40px auto;
  border: 1px solid #7f9db9;
  background: #ece9d8;
}
table td {
  padding: 4px 6px;
}
input {
  font-family: sans-serif;
  font-size: 14px;
  border: 1px solid #7f9db9;
  padding: 2px 4px;
}
.btn {
  font-family: sans-serif;
  font-size: 14px;
  border: 1px solid #7f9db9;
  background: #ece9d8;
  padding: 2px 12px;
  cursor: pointer;
}
.error {
  color: red;
  margin: 4px 0;
}
</style>
</head>
<body>
<table cellpadding="0" cellspacing="0">
  <tr><td colspan="2"><b>云效 Woodpecker 登录</b></td></tr>
  <tr><td colspan="2">请输入您的云效个人访问令牌（PAT）</td></tr>
  <tr><td colspan="2"><div id="error" class="error"></div></td></tr>
  <tr><td colspan="2"><hr></td></tr>
  <form id="loginForm">
  <tr>
    <td>个人访问令牌：</td>
    <td><input type="password" id="token" name="token" placeholder="请输入云效 PAT" autocomplete="off" autofocus></td>
  </tr>
  <tr>
    <td></td>
    <td><a href="https://help.aliyun.com/zh/yunxiao/developer-reference/obtain-personal-access-token" target="_blank" rel="noopener">如何获取个人访问令牌？</a></td>
  </tr>
  <tr><td colspan="2"><hr></td></tr>
  <tr><td colspan="2" align="center"><button type="submit" class="btn">登录</button></td></tr>
  </form>
</table>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var redirect = params.get('woodpecker_host');
  var errorEl = document.getElementById('error');
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var token = document.getElementById('token').value.trim();
    if (!token) {
      errorEl.textContent = '请输入个人访问令牌';
      return;
    }
    if (!redirect) {
      errorEl.textContent = '缺少 Woodpecker 服务地址参数，请从 Woodpecker 登录页面重新发起登录';
      return;
    }
    errorEl.textContent = '';
    window.location.href = redirect + '/authorize?code=' + encodeURIComponent(token);
  });
})();
</script>
</body>
</html>
